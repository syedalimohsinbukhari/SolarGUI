[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "SolarGUI"
version = "0.1.7"
description = "A program which contains information about the solar system planets, moon, pluto, Sun, and more."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "astropy", "typing-extensions"]

license = { text = "MIT" }
authors = [
    { name = "Syed Ali Mohsin Bukhari", email = "syedali.b@outlook.com" },
    { name = "Astrophysics and Python", email = "astrophysicsandpython@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
]


[project.urls]
Homepage = "https://github.com/syedalimohsinbukhari/SolarGUI"

[project.gui-scripts]
SolarGUI = "SolarGUI.solar_gui:Main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "Flake8-pyproject",
    "isort",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [".venv", "build", "dist", "*.egg-info"]